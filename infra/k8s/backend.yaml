apiVersion: apps/v1
kind: Deployment
metadata:
  name: swinra-backend
  namespace: swinra
spec:
  replicas: 2
  selector:
    matchLabels:
      app: swinra-backend
  template:
    metadata:
      labels:
        app: swinra-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/swinra-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: swinra-config
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: swinra-secrets
                  key: jwt-secret-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: swinra-backend
  namespace: swinra
spec:
  selector:
    app: swinra-backend
  ports:
    - port: 8000
      targetPort: 8000
